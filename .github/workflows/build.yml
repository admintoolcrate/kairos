name: Build

# Every push: unit and behaviour tests plus a debug APK.
# Release runs ("Run workflow" with release ticked, or a tag like v0.1.0): the optimised R8
# build, then a signed Play bundle uploaded to the Internal testing track, once the upload key
# and Play service account are added as secrets (docs/play-store/RELEASE.md).
on:
  push:
    branches: ["**"]
    # Website-only changes (privacy policy, Play listing notes) never build the app.
    paths-ignore: ["docs/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Also build the signed Play bundle and upload it to Internal testing
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
      - uses: actions/upload-artifact@v5
        with:
          name: kairos-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Check release build
        if: env.RELEASE == 'true'
        run: ./gradlew assembleRelease

  play-bundle:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
    env:
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
      - uses: actions/setup-java@v5
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
      - name: Build signed release bundle
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.jks"
          RELEASE_STORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v5
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        with:
          name: kairos-play-bundle
          path: app/build/outputs/bundle/release/app-release.aab
      # Internal testing only: no review, testers you list. Closed testing and production
      # stay a manual "Promote release" in Play Console, so nothing reaches people unseen.
      - name: Release notes
        if: env.UPLOAD_KEYSTORE_BASE64 != '' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        run: |
          mkdir -p whatsnew
          git log -1 --pretty=%s | cut -c1-480 > whatsnew/whatsnew-en-US
      - name: Upload to Google Play (Internal testing)
        if: env.UPLOAD_KEYSTORE_BASE64 != '' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cc.toolcrate.kairos
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed
          whatsNewDirectory: whatsnew
