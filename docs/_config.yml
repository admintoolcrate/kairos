# The website, kairos.toolcrate.cc: GitHub Pages (Settings → Pages → Deploy from a branch → main, /docs).
# It also hosts the privacy policy and the delete-your-data page Play needs. Keep it true to the app:
# see "Website" in CLAUDE.md.
title: Kairos
tagline: Calm Tools for Hard Moments
url: "https://kairos.toolcrate.cc"
description: Calm tools for hard moments.
repo: "https://github.com/admintoolcrate/kairos"
footer_blurb: Calm tools for hard moments. Free, offline, no ads, no accounts.
og_alt: "Kairos: Calm tools for hard moments. For Android."
plugins:
  - jekyll-redirect-from
  # Writes /sitemap.xml for search engines (supported by GitHub Pages).
  - jekyll-sitemap
# Every page uses the site's own layout (_layouts/default.html), in the family look.
defaults:
  - scope:
      path: ""
    values:
      layout: default
# Set to the Ko-fi page to show a link in the footer and on /support/.
kofi: "https://ko-fi.com/toolcratetips"
# Remembers the light/dark choice made with the toggle.
theme_key: kairos-theme
# Drafting notes for Play Console and the design notes aren't pages anyone needs to visit.
exclude:
  - play-store/RELEASE.md
  - play-store/data-safety.md
  - play-store/store-listing.md
  - family-look.md
# The ToolCrate family, for the footer and the "family" section on the home page.
family:
  - name: Stagira
    url: "https://stagira.toolcrate.cc"
    mark: stagira
    line: A quiet habit tracker. Count the days you keep.
  - name: Lyceum
    url: "https://lyceum.toolcrate.cc"
    mark: lyceum
    line: A daily reflection journal. One quiet page a day.
  - name: Telos
    url: "https://telos.toolcrate.cc"
    mark: telos
    line: A task manager and goal tracker. Tasks with a reason.
  - name: Kairos
    url: "https://kairos.toolcrate.cc"
    mark: kairos
    line: A calm companion for urges and panic. Calm tools for hard moments.
